name: Check VLESS Keys

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: check-keys
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      XRAY_BIN: ${{ github.workspace }}/.xray/xray
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray
        run: |
          mkdir -p .xray
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip" -o .xray/xray.zip
          unzip -q .xray/xray.zip -d .xray
          chmod +x .xray/xray

      - name: Install dependencies
        run: pip install requests

      - name: Run checker
        run: python check_and_save.py

      - name: Commit and push keys.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi

          git commit -m "chore: update keys and subscriptions [skip ci]"
          git pull --rebase
          git push
